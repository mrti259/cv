      - |
        Desarrollador Full Stack con **6 años de experiencia** en soluciones web y móviles con .NET (ASP.NET Core) y React Native (Expo).

        En Okapii construí 10+ proyectos de backend y 7 aplicaciones móviles publicadas en Play Store (50K+ y 100K+ descargas). Lideré entregas con clientes bajo Scrum/Kanban y soy ayudante en Ingeniería de Software 1 (UBA).

  - title: Experiencia
    content:
      - |
        ### Okapii — Desarrollador Full Stack | Mayo 2021 - Presente

        * Construí 10+ proyectos full stack con APIs REST en ASP.NET Core / .NET Framework, NHibernate y SQL Server, con frontends en React.
        * Desarrollé 7 aplicaciones móviles en React Native/TypeScript (Expo) y Flutter, publicadas en Play Store, incluyendo [AdminProp Vecinos](https://play.google.com/store/apps/details?id=com.adminpropapp) (50K+ descargas) y [Xhendra COMmunity](https://play.google.com/store/apps/details?id=ar.xhendra.sesiapp) (100K+ descargas).
        * Mentoreé a desarrolladores del equipo en buenas prácticas de React Native y .NET.

        **Asignación como Líder de Proyecto | Enero 2025 - Junio 2025**

        * Lideré un equipo de 2 desarrolladores en la construcción de una app móvil y una API REST, coordinando prioridades con el cliente y cumpliendo el plan de entregas semanales bajo Scrum/Kanban.
        * Estandaricé el flujo en GitHub (branches, PRs con revisión obligatoria y pruebas de endpoints antes de cada release), reduciendo errores críticos en producción.

      - |
        ### Ministerio de Defensa de Argentina

        **Desarrollador Full Stack** | Noviembre 2020 - Mayo 2021 — Un proyecto: aplicación web en Laravel con backend en .NET (API REST) y SQL Server.

