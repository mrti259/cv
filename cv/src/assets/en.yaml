        * Developed 7 mobile applications in React Native/TypeScript (Expo) and Flutter, published on the Play Store, including [AdminProp Vecinos](https://play.google.com/store/apps/details?id=com.adminpropapp) (50K+ downloads) and [Xhendra COMmunity](https://play.google.com/store/apps/details?id=ar.xhendra.sesiapp) (100K+ downloads).
        * Mentored team developers in React Native and .NET best practices.

        **Assignment as Project Lead | January 2025 - June 2025**

        * Led a team of 2 developers building a mobile app and a REST API, coordinating priorities with the client and delivering on the weekly release plan under Scrum/Kanban.
        * Standardized the GitHub flow (branches, mandatory PR reviews and manual API checks before each release), reducing critical production issues.

      - |
        ### Ministry of Defense, Argentina

        **Full Stack Developer** | November 2020 - May 2021 — One project: Laravel web app with .NET backend (REST API) and SQL Server.

